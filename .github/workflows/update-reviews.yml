name: Update Google reviews

on:
  schedule:
    - cron: '17 3 * * *'   # every day, ~05:17 Israel time
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch reviews from Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-reviews.mjs
      - name: Commit if changed
        run: |
          git config user.name "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || (git commit -m "Update Google reviews" && git push)
